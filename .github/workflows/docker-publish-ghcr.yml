name: Publish Docker image (ghcr.io)

# Builds the repo's own Dockerfile on GitHub's runners and publishes it as
# ghcr.io/zema-tech/hermes-agent:latest, so hosts with little build capacity
# (e.g. a Hugging Face Space, see hf-space/) can just pull the ready image.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - docker/**
      - .github/workflows/docker-publish-ghcr.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-ghcr
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/zema-tech/hermes-agent:latest
          labels: |
            org.opencontainers.image.source=https://github.com/zema-tech/hermes-agent
          cache-from: type=gha
          cache-to: type=gha,mode=max
